runs: 5
applications_file: "configs/applications.yaml"
models_file: "configs/models.yaml"
rubric_path: "rubric/rubric_items.txt"   

strategies:
  section_rag:
    enabled: true
    unit: "section"
    rag: true
    prompt_path: "prompts/section_rag.txt"
    aggregation: "or"
  full_rag:
    enabled: true
    unit: "full"
    rag: true
    prompt_path: "prompts/full_policy_rag.txt"
  section_norag:
    enabled: true
    unit: "section"
    rag: false
    prompt_path: "prompts/section.txt"
    aggregation: "or"
  full_norag:
    enabled: true
    unit: "full"
    rag: false
    prompt_path: "prompts/full_policy.txt"

retrieval:
  corpus_path: "data/pdpl/IRPDPL.docx"
  embedding_model: "intfloat/multilingual-e5-small"
  embedding_max_length: 512
  embedding_device: null
  chunking: "docx_heading_sections" 
  top_k_section: 3 
  top_k_full: 3 
  section_context_separator: "\n"
  full_context_separator: "\n\n"

generation:
  max_new_tokens: 800 
  temperature: 0.1 
  top_p: 0.95
  repetition_penalty: 1.15
  do_sample: true 
  seed_base: 1234 

retry:
  max_attempts: 3
  base_delay_seconds: 5
  backoff_factor: 2.0
  max_delay_seconds: 120
  jitter_seconds: 1.0

output:
  results_dir: "results"
  hf_token_env: "HF_TOKEN"

ground_truth:
  xlsx_path: "data/ground_truth/PDPL_Results.xlsx"
  sheet_name: "Expert Analysis"

analysis:
  bootstrap_samples: 2000
  bootstrap_seed: 2026
  keyword_patterns_path: null  
