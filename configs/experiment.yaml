# Experiment settings. Nothing here is hard-coded in the evaluation code.
# Parameter values marked [notebook] are the notebook's baseline values.

runs: 5                                  # runs per application x model x strategy
applications_file: "configs/applications.yaml"
models_file: "configs/models.yaml"

rubric_path: "rubric/rubric_items.txt"   # [notebook] 17 items A1..D2, joined with "\n"

# Strategy names are fixed identifiers used in file paths and result records.
#   section_rag    = notebook baseline "Section-by-Section (OR)"
#   full_norag     = notebook baseline "Full-Policy"
#   full_rag       = notebook Experiment 1 "Full-Policy+Law"
#   section_norag  = NEW (no notebook equivalent): section prompt without the PDPL excerpts block
strategies:
  section_rag:
    enabled: true
    unit: "section"
    rag: true
    prompt_path: "prompts/section_rag.txt"
    aggregation: "or"
  full_rag:
    enabled: true
    unit: "full"
    rag: true
    prompt_path: "prompts/full_policy_rag.txt"
  section_norag:
    enabled: true
    unit: "section"
    rag: false
    prompt_path: "prompts/section_no_rag.txt"
    aggregation: "or"
  full_norag:
    enabled: true
    unit: "full"
    rag: false
    prompt_path: "prompts/full_policy.txt"

retrieval:
  corpus_path: "data/pdpl/IRPDPL.docx"             # [notebook] PDPL_DOCX_PATH = "IRPDPL.docx"
  embedding_model: "intfloat/multilingual-e5-small" # [notebook]
  embedding_max_length: 512                         # [notebook] (query/passage truncation inside the embedder)
  embedding_device: null                            # null => cuda if available else cpu, as in the notebook
  chunking: "docx_heading_sections"                 # [notebook] one chunk per Heading-delimited section
  top_k_section: 3                                  # [notebook] retriever k=3, query = section content
  top_k_full: 3                                     # [notebook, Exp1] retriever k=3, query = rubric text
  section_context_separator: "\n"                   # [notebook] "\n".join(page_content)
  full_context_separator: "\n\n"                    # [notebook, Exp1] "\n\n".join(page_content)

generation:
  max_new_tokens: 800                               # [notebook]
  temperature: 0.1                                  # [notebook]
  top_p: 0.95                                       # [notebook]
  repetition_penalty: 1.15                          # [notebook]
  do_sample: true                                   # [notebook]
  seed_base: 1234                                   # NEW: seed for run r is seed_base + r (notebook was unseeded)

retry:
  max_attempts: 3
  base_delay_seconds: 5
  backoff_factor: 2.0
  max_delay_seconds: 120
  jitter_seconds: 1.0

output:
  results_dir: "results"
  hf_token_env: "HF_TOKEN"

# Optional, used only by src/pdpl_eval/evaluation.py (preserved notebook metrics; not run by the pipeline)
ground_truth:
  xlsx_path: "data/ground_truth/PDPL Results.xlsx"
  sheet_name: "Expert Analysis"
